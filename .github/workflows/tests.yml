name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions: {}

# A new commit on a pull request cancels that pull request's superseded run. Pushes to
# main and tags get a group of their own (the run ID), so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    # A real PostgreSQL for the persistence, migration, and restart tests.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      NEST_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      # Fail, rather than skip, if the PostgreSQL tests cannot run.
      NEST_TEST_DATABASE_REQUIRED: "1"
      # Fail, rather than skip, if the real-browser tests cannot run.
      NEST_TEST_BROWSER_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PostgreSQL 17 client tools for the backup and restore test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "NEST_TEST_PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
      - name: Start a TLS-enabled PostgreSQL for the TLS verification tests
        run: |
          certs="$RUNNER_TEMP/postgres-tls"
          bash tests/make_postgres_tls_certs.sh "$certs"
          docker run -d --name postgres-tls -p 127.0.0.1:5433:5432 \
            -e POSTGRES_PASSWORD=postgres -v "$certs:/certs:ro" postgres:17 \
            bash -c 'cp /certs/server.crt /certs/server.key /tmp/ && chown postgres /tmp/server.* && chmod 600 /tmp/server.key && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key'
          for _ in $(seq 60); do
            docker exec postgres-tls pg_isready -U postgres -h 127.0.0.1 && break
            sleep 1
          done
          {
            echo "NEST_TEST_TLS_DATABASE_URL=postgresql://postgres:postgres@localhost:5433/postgres"
            echo "NEST_TEST_TLS_CA_FILE=$certs/ca.crt"
            echo "NEST_TEST_TLS_OTHER_CA_FILE=$certs/other-ca.crt"
          } >> "$GITHUB_ENV"
      - name: Install Chromium for the real-browser tests
        run: uv run --frozen playwright install --with-deps chromium
      # Eight pytest-xdist workers: the suite mostly waits on subprocesses, servers and
      # PostgreSQL, and on the 4-vCPU runner wall time stops improving beyond eight
      # (see docs/source/developing.md). Coverage is combined across the workers.
      - name: Test with python ${{ matrix.python-version }}
        run: uv run --frozen pytest --cov=src/nest --numprocesses 8 --durations 20
