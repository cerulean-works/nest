name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    # A real PostgreSQL for the persistence, migration, and restart tests.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      NEST_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      # Fail, rather than skip, if the PostgreSQL tests cannot run.
      NEST_TEST_DATABASE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test with python ${{ matrix.python-version }}
        run: uv run --frozen pytest --cov=src/nest
