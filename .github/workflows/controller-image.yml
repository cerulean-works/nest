name: Controller container

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controller-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the optional Tailnet and Dokploy Compose configurations
        run: |
          docker compose -f compose.tailscale.yaml config --quiet
          docker compose -f compose.tailscale-shared.yaml config --quiet
          NEST_TAILSCALE_AUTHKEY= docker compose -f compose.dokploy.yaml config --quiet
          python tests/check_shared_compose.py
      - name: Build the Controller image with Compose
        env:
          NEST_CONTROLLER_IMAGE: nest-controller:test
        run: docker compose build --pull controller
      - name: Test Controller RPCs, shutdown, and SSH proxy
        run: |
          docker run --rm --volume "$PWD/tests:/tests:ro" \
            --volume "$PWD/docker:/docker:ro" \
            --volume "$PWD/scripts:/scripts:ro" \
            --entrypoint python nest-controller:test \
            -m unittest discover -s /tests -v
      - name: Test Compose deployment and SSH credentials
        run: bash tests/smoke_compose.sh
      - name: Test Compose default and local-db PostgreSQL deployments, persistence, and backups
        run: bash tests/smoke_compose_postgres.sh
      - name: Test the environment-only (Dokploy) deployment without mounted credentials
        run: bash tests/smoke_compose_env.sh
      - name: Test the documented PostgreSQL 17 to 18 upgrade and rollback
        run: bash tests/smoke_compose_postgres_upgrade.sh
      - name: Test Controller-to-Login-Node SSH through the Tailnet proxy path
        run: bash tests/smoke_tailnet_ssh.sh
      - name: Test the HPC runtime image with a Git-based uv dependency
        run: bash tests/smoke_hpc_runtime.sh
