name: nest

services:
  controller:
    image: ${NEST_CONTROLLER_IMAGE:-nest-controller:local}
    build: .
    pull_policy: build
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      NEST_CONTROLLER_BIND: 0.0.0.0:50051
      NEST_EXECUTOR: ${NEST_EXECUTOR:-slurm}
      NEST_SLURM_HOST: ${NEST_SLURM_HOST:-}
      NEST_SLURM_ACCOUNT: ${NEST_SLURM_ACCOUNT:-}
      NEST_SLURM_WORKDIR: ${NEST_SLURM_WORKDIR:-}
      NEST_LOG_LEVEL: ${NEST_LOG_LEVEL:-INFO}
      NEST_SSH_TIMEOUT: ${NEST_SSH_TIMEOUT:-}
      NEST_RESULT_TIMEOUT: ${NEST_RESULT_TIMEOUT:-}
      NEST_ENVIRONMENT_TIMEOUT: ${NEST_ENVIRONMENT_TIMEOUT:-}
      NEST_POLL_INTERVAL: ${NEST_POLL_INTERVAL:-}
      NEST_SLURM_LOGIN_NODES: ${NEST_SLURM_LOGIN_NODES:-}
      NEST_SLURM_SSH_MODE: ${NEST_SLURM_SSH_MODE:-}
      NEST_SLURM_SSH_USER: ${NEST_SLURM_SSH_USER:-}
      NEST_SLURM_PARTITION: ${NEST_SLURM_PARTITION:-}
      NEST_SLURM_TIME: ${NEST_SLURM_TIME:-}
      NEST_SSH_MODES_ALLOWED: ${NEST_SSH_MODES_ALLOWED:-}
      NEST_SSH_KNOWN_HOSTS: ${NEST_SSH_KNOWN_HOSTS:-}
      NEST_SSH_KNOWN_HOSTS_DATA: ${NEST_SSH_KNOWN_HOSTS_DATA:-}
      NEST_SSH_IDENTITY_FILE: ${NEST_SSH_IDENTITY_FILE:-}
      NEST_SSH_PRIVATE_KEY: ${NEST_SSH_PRIVATE_KEY:-}
      NEST_TLS_CERT_FILE: ${NEST_TLS_CERT_FILE:-}
      NEST_TLS_KEY_FILE: ${NEST_TLS_KEY_FILE:-}
      NEST_PUBLIC_URL: ${NEST_PUBLIC_URL:-}
    volumes:
      - type: bind
        source: ${NEST_SSH_DIR:-./ssh}
        target: /run/nest-ssh
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
      - /home/nest/.ssh:mode=0700
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
