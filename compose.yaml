name: nest

services:
  controller:
    image: ${NEST_CONTROLLER_IMAGE:-nest-controller:local}
    build: .
    pull_policy: build
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      NEST_CONTROLLER_BIND: 0.0.0.0:50051
      NEST_EXECUTOR: ${NEST_EXECUTOR:-slurm}
      NEST_SLURM_HOST: ${NEST_SLURM_HOST:-}
      NEST_SLURM_ACCOUNT: ${NEST_SLURM_ACCOUNT:-}
      NEST_SLURM_WORKDIR: ${NEST_SLURM_WORKDIR:-}
      NEST_LOG_LEVEL: ${NEST_LOG_LEVEL:-INFO}
      NEST_SSH_TIMEOUT: ${NEST_SSH_TIMEOUT:-}
      NEST_RESULT_TIMEOUT: ${NEST_RESULT_TIMEOUT:-}
      NEST_ENVIRONMENT_TIMEOUT: ${NEST_ENVIRONMENT_TIMEOUT:-}
      NEST_POLL_INTERVAL: ${NEST_POLL_INTERVAL:-}
      NEST_SLURM_LOGIN_NODES: ${NEST_SLURM_LOGIN_NODES:-}
      NEST_SLURM_SSH_MODE: ${NEST_SLURM_SSH_MODE:-}
      NEST_SLURM_SSH_USER: ${NEST_SLURM_SSH_USER:-}
      NEST_SLURM_PARTITION: ${NEST_SLURM_PARTITION:-}
      NEST_SLURM_TIME: ${NEST_SLURM_TIME:-}
      NEST_SSH_MODES_ALLOWED: ${NEST_SSH_MODES_ALLOWED:-}
      NEST_SSH_KNOWN_HOSTS: ${NEST_SSH_KNOWN_HOSTS:-}
      NEST_SSH_KNOWN_HOSTS_DATA: ${NEST_SSH_KNOWN_HOSTS_DATA:-}
      NEST_SSH_IDENTITY_FILE: ${NEST_SSH_IDENTITY_FILE:-}
      NEST_SSH_PRIVATE_KEY: ${NEST_SSH_PRIVATE_KEY:-}
      NEST_TLS_CERT_FILE: ${NEST_TLS_CERT_FILE:-}
      NEST_TLS_KEY_FILE: ${NEST_TLS_KEY_FILE:-}
      NEST_PUBLIC_URL: ${NEST_PUBLIC_URL:-}
      NEST_DATABASE_URL: ${NEST_DATABASE_URL:-}
      NEST_DATABASE_REQUIRED: ${NEST_DATABASE_REQUIRED:-}
      NEST_DATABASE_PASSWORD_FILE: ${NEST_DATABASE_PASSWORD_FILE:-}
      NEST_DATABASE_SSLMODE: ${NEST_DATABASE_SSLMODE:-}
      NEST_DATABASE_SSLROOTCERT: ${NEST_DATABASE_SSLROOTCERT:-}
      NEST_DATABASE_SSLCERT: ${NEST_DATABASE_SSLCERT:-}
      NEST_DATABASE_SSLKEY: ${NEST_DATABASE_SSLKEY:-}
      NEST_DATABASE_POOL_MIN_SIZE: ${NEST_DATABASE_POOL_MIN_SIZE:-}
      NEST_DATABASE_POOL_MAX_SIZE: ${NEST_DATABASE_POOL_MAX_SIZE:-}
      NEST_DATABASE_CONNECT_TIMEOUT: ${NEST_DATABASE_CONNECT_TIMEOUT:-}
      NEST_DATABASE_POOL_TIMEOUT: ${NEST_DATABASE_POOL_TIMEOUT:-}
      NEST_EMAIL_ENABLED: ${NEST_EMAIL_ENABLED:-}
      NEST_EMAIL_PROVIDER: ${NEST_EMAIL_PROVIDER:-}
      NEST_EMAIL_FROM: ${NEST_EMAIL_FROM:-}
      NEST_EMAIL_MAX_ATTEMPTS: ${NEST_EMAIL_MAX_ATTEMPTS:-}
      NEST_EMAIL_RETRY_DELAY: ${NEST_EMAIL_RETRY_DELAY:-}
      NEST_EMAIL_RETRY_MAX_DELAY: ${NEST_EMAIL_RETRY_MAX_DELAY:-}
      NEST_EMAIL_POLL_INTERVAL: ${NEST_EMAIL_POLL_INTERVAL:-}
      NEST_SMTP_HOST: ${NEST_SMTP_HOST:-}
      NEST_SMTP_PORT: ${NEST_SMTP_PORT:-}
      NEST_SMTP_STARTTLS: ${NEST_SMTP_STARTTLS:-}
      NEST_SMTP_IMPLICIT_TLS: ${NEST_SMTP_IMPLICIT_TLS:-}
      NEST_SMTP_USERNAME: ${NEST_SMTP_USERNAME:-}
      NEST_SMTP_PASSWORD: ${NEST_SMTP_PASSWORD:-}
      NEST_SMTP_PASSWORD_FILE: ${NEST_SMTP_PASSWORD_FILE:-}
      NEST_SMTP_CA_FILE: ${NEST_SMTP_CA_FILE:-}
      NEST_SMTP_TIMEOUT: ${NEST_SMTP_TIMEOUT:-}
    ports:
      - "${NEST_CONTROLLER_HOST_IP:-127.0.0.1}:${NEST_CONTROLLER_PORT:-50051}:50051"
    volumes:
      - type: bind
        source: ${NEST_SSH_DIR:-./ssh}
        target: /run/nest-ssh
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
      - /home/nest/.ssh:mode=0700
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional Docker-managed PostgreSQL. Started only with an explicit profile:
  #
  #   docker compose --profile local-db up -d --wait
  #
  # The default `docker compose up -d` starts no database. The Controller never
  # applies migrations; run `nest-db upgrade` yourself (see docs/source/database.md).
  postgres:
    profiles: [local-db]
    image: ${NEST_POSTGRES_IMAGE:-postgres:17.12-bookworm}
    restart: unless-stopped
    # The image stops on SIGINT (fast shutdown); allow it to finish a checkpoint.
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: nest
      POSTGRES_USER: nest
      POSTGRES_PASSWORD_FILE: /run/secrets/nest_postgres_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256
    secrets:
      - nest_postgres_password
    # Loopback only, on purpose: this server has no TLS. There is deliberately no
    # variable for the interface; reach it from other hosts through an SSH tunnel,
    # or use an externally managed PostgreSQL with verify-full TLS.
    ports:
      - "127.0.0.1:${NEST_POSTGRES_PORT:-5432}:5432"
    volumes:
      - type: volume
        source: postgres-data
        target: ${NEST_POSTGRES_DATA_DIR:-/var/lib/postgresql/data}
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=nest", "--dbname=nest"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  # Read only by the local-db profile. Generate it once, before the first start:
  #   (umask 077; openssl rand -hex 32 > ssh/nest-postgres-password)
  # The default path is inside NEST_SSH_DIR, so a Controller container also sees it
  # as /home/nest/.ssh/nest-postgres-password (NEST_DATABASE_PASSWORD_FILE).
  nest_postgres_password:
    file: ${NEST_POSTGRES_PASSWORD_FILE:-${NEST_SSH_DIR:-./ssh}/nest-postgres-password}

volumes:
  # Survives `docker compose down`; only `down --volumes` deletes it.
  postgres-data:
