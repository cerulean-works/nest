# Dokploy Traefik: pass the public gRPC name through to the Nest gateway (H08).
#
# Copy to /etc/dokploy/traefik/dynamic/nest-grpc.yml on the Dokploy host (Traefik
# reloads dynamic files by itself; every other router is unchanged). Deleting the
# file is the rollback. Traefik does not terminate TLS for this name: Envoy holds the
# certificate, so Traefik's own timeouts and certificates do not apply to it.
#
# Replace grpc.nest.cerulean.works with the staging name for a staging run, or
# render it with deploy/public-grpc/traefik/render.sh. For Traefik v2.x to v3.4.
tcp:
  routers:
    nest-grpc:
      entryPoints:
        - websecure
      rule: HostSNI(`grpc.nest.cerulean.works`)
      service: nest-grpc-gateway
      tls:
        passthrough: true
  services:
    nest-grpc-gateway:
      loadBalancer:
        servers:
          # The gateway's alias on dokploy-network (compose.dokploy.yaml, profile
          # public-grpc). Its port is never published on the host.
          - address: nest-grpc-gateway:8443
        # Envoy requires PROXY protocol v2 and refuses connections without it, so
        # the client address survives the TLS passthrough. Verified with Traefik
        # v2.11, v3.2, v3.3, v3.4.5, v3.5.3 and v3.6.2 (tests/check_traefik_passthrough.sh).
        # v3.5 and later log this key as deprecated: use
        # nest-grpc.servers-transport.yml there. A mismatch fails closed.
        proxyProtocol:
          version: 2
