[project]
name = "nest"
version = "0.1.0a1"
description = "A Python SDK for remote function execution on HPC clusters"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "cloudpickle>=3.1.2",
    "grpcio>=1.84.0",
    "protobuf>=7.36.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/nest/proto/*_pb2*"]

[tool.ruff.lint]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["nest"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ty.src]
exclude = ["src/nest/proto/*_pb2*"]
