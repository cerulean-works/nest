[project]
name = "nest"
version = "0.1.0a1"
description = "A Python SDK for remote function execution on HPC clusters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cloudpickle>=3.1.2",
    "grpcio>=1.84.0",
    "protobuf>=7.36.2",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
]
